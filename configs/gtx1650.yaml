# Training config for a 4GB card (GTX 1650 and similar).
#
# Your 1650 CANNOT generate the dataset (FLUX needs 12GB+ even at 4-bit), but
# it CAN train the delta net -- slowly -- and it runs the finished product at
# ~330ms/image, which is genuinely fine.
#
# Trade-offs vs configs/base.yaml:
#   base_channels 64 -> 32  : 34.5M -> 8.6M params, ~4x less compute.
#                             Noticeably softer skin texture. Acceptable for a
#                             v1 you're showing people; retrain at 64 later.
#   crop 512 -> 256         : the model is fully convolutional, so a net trained
#                             on 256 crops still runs at 4K. Wrinkles are a
#                             LOCAL texture -- 256px sees plenty of them.
#   batch 4 -> 2            : fits ~2.9GB free VRAM.
#
# Close Chrome before training. Your nvidia-smi showed 1.2GB already eaten by
# Chrome/Explorer/WhatsApp -- that's a third of your card.
#
# Honest expectation: ~2-4 days for 30 epochs on 12k pairs. Kaggle's T4 does it
# in ~8h and my train.py supports --resume, so it survives the 12h session cap.
# Train locally only if you'd rather wait than babysit a notebook.

pairs_file: data/processed/pairs.jsonl
out_dir: weights
device: null

crop: 256
batch_size: 2
num_workers: 2          # Windows: keep low, spawn overhead is real
epochs: 30
save_every: 2           # checkpoint often; you WILL interrupt this
log_every: 100
amp: true               # Turing does fp16 at 2:1 -- worth it for memory alone

base_channels: 32

lr_g: 1.0e-4
lr_d: 4.0e-4

perceptual: none        # also saves ~500MB of VGG you don't have room for

loss_weights:
  l1: 1.0
  perceptual: 0.5
  adv: 0.05
  identity_cycle: 2.0
  delta_sparsity: 0.02
